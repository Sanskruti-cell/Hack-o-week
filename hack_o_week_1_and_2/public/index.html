<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST API Whiteboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
            background: #222;
            color: white;
            padding: 20px;
            margin: 0;
        }

        .container {
            padding: 20px;
            text-align: center;
        }

        input {
            padding: 12px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 18px;
            margin-left: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
        }

        button:hover {
            background: #0056b3;
        }

        #whiteboard {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 30px;
        }

        .note {
            background: #fff;
            width: 180px;
            min-height: 100px;
            padding: 15px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            border-radius: 8px;
            position: relative;
        }

        .delete {
            background: red;
            position: absolute;
            bottom: 10px;
            left: 10px;
        }

        .delete:hover {
            background: darkred;
        }
    </style>
</head>

<body>

    <h1>REST API Whiteboard</h1>

    <div class="container">
        <input
            type="text"
            id="noteInput"
            placeholder="Enter your note"
        >

        <button onclick="addNote()">Add Note</button>
    </div>

    <div id="whiteboard"></div>

    <script>

        // GET - Fetch notes
        async function loadNotes() {

            const response = await fetch("/api/notes");

            const notes = await response.json();

            const whiteboard = document.getElementById("whiteboard");

            whiteboard.innerHTML = "";

            notes.forEach(note => {

                const div = document.createElement("div");

                div.className = "note";

                div.innerHTML = `
                    <p>${note.text}</p>
                    <button class="delete"
                        onclick="deleteNote(${note.id})">
                        Delete
                    </button>
                `;

                whiteboard.appendChild(div);
            });
        }


        // POST - Add note
        async function addNote() {

            const input = document.getElementById("noteInput");

            const text = input.value.trim();

            if (text === "") {
                alert("Please enter a note");
                return;
            }

            await fetch("/api/notes", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    text: text
                })
            });

            input.value = "";

            loadNotes();
        }


        // DELETE - Delete note
        async function deleteNote(id) {

            await fetch(`/api/notes/${id}`, {
                method: "DELETE"
            });

            loadNotes();
        }


        // Load notes when page opens
        loadNotes();

    </script>

</body>
</html>
